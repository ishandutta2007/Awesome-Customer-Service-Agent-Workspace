<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.35" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.4" />
    </pattern>

    <!-- Dynamic Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-orb-1 {
        animation: pulseOrb1 7s ease-in-out infinite alternate;
      }
      .bg-orb-2 {
        animation: pulseOrb2 9s ease-in-out infinite alternate;
      }
      .flow-beam-1 {
        stroke-dasharray: 120 200;
        animation: flowBeam 5s linear infinite;
      }
      .flow-beam-2 {
        stroke-dasharray: 90 180;
        animation: flowBeamReverse 6s linear infinite;
      }
      .pulse-pill {
        animation: floatPill 4s ease-in-out infinite alternate;
      }
      .pulse-pill-delayed {
        animation: floatPill 4.5s ease-in-out infinite alternate-reverse;
      }
      .signal-dot {
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      @keyframes pulseOrb1 {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
        100% { transform: scale(1.35) translate(40px, 20px); opacity: 0.45; }
      }
      @keyframes pulseOrb2 {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.2; }
        100% { transform: scale(1.4) translate(-50px, -25px); opacity: 0.4; }
      }
      @keyframes flowBeam {
        from { stroke-dashoffset: 640; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowBeamReverse {
        from { stroke-dashoffset: -540; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
      @keyframes ping {
        75%, 100% {
          transform: scale(2.2);
          opacity: 0;
        }
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#tech-grid)" />

  <!-- Dynamic Glowing Mesh Spheres (Background) -->
  <g>
    <circle cx="220" cy="90" r="140" fill="#0284c7" filter="url(#glow-cyan)" class="bg-orb-1" />
    <circle cx="980" cy="320" r="170" fill="#7c3aed" filter="url(#glow-purple)" class="bg-orb-2" />
    <circle cx="860" cy="80" r="110" fill="#db2777" opacity="0.18" filter="url(#glow-cyan)" />
    <circle cx="160" cy="340" r="100" fill="#4f46e5" opacity="0.22" filter="url(#glow-purple)" />
  </g>

  <!-- Dynamic Circuit / Neural Flow Lines (Background to Midground) -->
  <g fill="none" stroke-linecap="round">
    <!-- Static Track 1 -->
    <path d="M 80 210 Q 300 80 600 210 T 1120 210" stroke="#334155" stroke-width="2" stroke-opacity="0.3" />
    <!-- Dynamic Glowing Flow 1 -->
    <path d="M 80 210 Q 300 80 600 210 T 1120 210" stroke="#38bdf8" stroke-width="2.5" class="flow-beam-1" opacity="0.8" />

    <!-- Static Track 2 -->
    <path d="M 80 260 Q 300 370 600 260 T 1120 260" stroke="#334155" stroke-width="2" stroke-opacity="0.3" />
    <!-- Dynamic Glowing Flow 2 -->
    <path d="M 80 260 Q 300 370 600 260 T 1120 260" stroke="#c084fc" stroke-width="2.5" class="flow-beam-2" opacity="0.8" />
  </g>

  <!-- Dynamic Interactive Floating Feature Badges / Pills (Midground) -->
  <g class="pulse-pill" transform="translate(0, 0)">
    <g transform="translate(140, 48)">
      <rect width="165" height="34" rx="17" fill="#0f172a" stroke="url(#card-border)" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4.5" fill="#10b981" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Omnichannel Hub</text>
    </g>

    <g transform="translate(895, 52)">
      <rect width="175" height="34" rx="17" fill="#0f172a" stroke="url(#card-border)" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">AI Agent Copilot</text>
    </g>
  </g>

  <g class="pulse-pill-delayed" transform="translate(0, 0)">
    <g transform="translate(115, 338)">
      <rect width="180" height="34" rx="17" fill="#0f172a" stroke="url(#card-border)" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4.5" fill="#f59e0b" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Unified Team Inbox</text>
    </g>

    <g transform="translate(905, 335)">
      <rect width="180" height="34" rx="17" fill="#0f172a" stroke="url(#card-border)" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4.5" fill="#ec4899" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">SaaS &amp; Open Source</text>
    </g>
  </g>

  <!-- FOREGROUND: Unobscured High-Contrast Typography & Core Titles -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <g transform="translate(600, 115)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#a5b4fc">
        ⚡ AWESOME ECOSYSTEM ⚡
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1" fill="url(#title-grad)">
      Customer Service Agent Workspace
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#cbd5e1">
      Unified Inboxes • Omnichannel Ticketing • AI-Assisted Resolution
    </text>

    <!-- Tech Stack / Category Micro-Pills -->
    <g transform="translate(600, 280)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
        Zendesk  •  Salesforce  •  ServiceNow  •  Freshdesk  •  Chatwoot  •  Zammad  •  FreeScout  •  TGO
      </text>
    </g>
  </g>

  <!-- Subtle Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.4" />
</svg>
